name: CI

# 门禁定位：
#   verify —— 与本地 `pnpm verify` 完全同一套命令（类型 / Lint / 样式 / 格式 / 单测 / 前端生产构建），
#             使 husky 的本地检查不再是「可被 --no-verify 绕过」的唯一防线。
#             历史教训：main.ts 的顶层 await 让两个前端的生产构建坏了很久，
#             而 verify 当时只跑 dev 侧的检查、不跑 build，于是没有任何一道门禁看得见它。
#             前端构建现已并入 verify（并行约 10s），本地与 CI 因此天然同步。
#   docker —— 真实构建三个镜像并把 rest-api 拉起来打通 /health。
#             历史教训：docker/Dockerfile 曾漏拷 packages/，pnpm 装出悬空软链使 install 假成功，
#             tsc 报 TS2307 导致生产镜像长期构建不出来而无人发现。仅构建不启动是发现不了启动期问题的，
#             因此这里必须真正 run 起来做冒烟。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消仍在跑的旧流水线
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 与 .nvmrc / package.json engines 对齐
  NODE_VERSION: "22"
  PNPM_VERSION: "10.17.0"

jobs:
  verify:
    name: 类型 / Lint / 样式 / 格式 / 单测
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # `pnpm verify` 自己的第一步就是 build:packages（packages/* 的 dist 是 Node 侧
      # `node` 导出条件的消费目标），所以这里不再单独跑一次。
      - name: 质量门禁（等价本地 pnpm verify）
        run: pnpm run verify

  integration:
    name: 集成测试（真实 MySQL + Redis）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: express_vue3_monorepo_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      APP_ENV: test
      NODE_ENV: test
      # 用 root 连接：集成测试基座需要 CREATE / DROP DATABASE 权限来为每个测试文件建独立库
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PWD: ci_root_pw
      DB_NAME: express_vue3_monorepo_ci
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci_integration_secret_at_least_32_characters
      ADMIN_BOOTSTRAP_USERNAME: ci_admin
      ADMIN_BOOTSTRAP_PASSWORD: ci_admin_password_123
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 workspace 包
        run: pnpm run build:packages

      # 迁移在真实 MySQL 上执行一遍，等于每次 PR 都回归了 DDL 本身
      - name: 集成测试
        run: pnpm run test:integration

  audit:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # 只看 --prod：devDependencies 的告警不会进生产镜像，把它们也做成门禁
      # 只会让 CI 常年飘红，然后所有人学会忽略它——那比没有门禁更糟。
      # 阈值 high：真出 high/critical 的生产依赖就该拦下来人工看一眼。
      # 仓库 .npmrc 把 registry 指向 npmmirror（国内装包快），但镜像源没有实现 audit 端点，
      # 直接跑会以 ERR_PNPM_AUDIT_ENDPOINT_NOT_EXISTS 失败——只有这一步需要回官方源。
      - name: pnpm audit（生产依赖，high 及以上）
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: pnpm audit --prod --audit-level high

  docker:
    name: 镜像构建与启动冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: express_vue3_monorepo_ci
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建 rest-api 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: evm/rest-api:ci
          load: true
          cache-from: type=gha,scope=rest-api
          cache-to: type=gha,scope=rest-api,mode=max

      - name: 构建 pc-portal 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.pc-portal
          tags: evm/pc-portal:ci
          load: true
          cache-from: type=gha,scope=pc-portal
          cache-to: type=gha,scope=pc-portal,mode=max

      - name: 构建 pc-admin 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.pc-admin
          tags: evm/pc-admin:ci
          load: true
          cache-from: type=gha,scope=pc-admin
          cache-to: type=gha,scope=pc-admin,mode=max

      # 只构建不启动无法暴露「镜像装好了但跑不起来」这类问题，故必须真跑。
      # --network host 让容器直接访问 job services 暴露在 runner localhost 上的 MySQL / Redis。
      - name: 启动 rest-api 容器
        run: |
          docker run -d --name rest-api-smoke --network host \
            -e APP_ENV=production \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e JWT_SECRET="$(head -c 48 /dev/urandom | base64 | tr -d '=+/' | head -c 48)" \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_NAME=express_vue3_monorepo_ci \
            -e DB_USER=ci_user \
            -e DB_PWD=ci_password \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            evm/rest-api:ci

      - name: 冒烟 /health 与 /ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null 2>&1; then
              echo "存活探针通过"
              curl -fsS http://127.0.0.1:3000/ready && echo
              # 生产默认不挂 API 文档（API_DOCS_ENABLED）。这里断言的是「测不到」——
              # 之前反过来断言「可服务」，等于把一条本不该对外的端点写进了门禁。
              docs_status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/openapi.yaml)
              if [ "$docs_status" != "404" ]; then
                echo "::error::生产镜像不应对外提供 /openapi.yaml（实际 HTTP $docs_status）"
                exit 1
              fi
              echo "API 文档在生产默认关闭（/openapi.yaml -> 404）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::rest-api 容器 120s 内未就绪，日志如下"
          docker logs rest-api-smoke
          exit 1

      - name: 失败时导出容器日志
        if: failure()
        run: docker logs rest-api-smoke || true

      - name: 清理
        if: always()
        run: docker rm -f rest-api-smoke || true
