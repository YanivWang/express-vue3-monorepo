# 仅提供给 pc-admin 容器内置 Nginx（生产/测试）：托管带 subpath base 构建的 SPA；
# 入口路径由网关 /pc-admin/ strip 后以根路径转发到本机 80。
# （HTML 仍引用 /pc-admin/assets/...，仅经网关剥离前缀后可命中 dist 根下 assets）

worker_processes 1;

events {
    worker_connections 1024;
}

pid /tmp/nginx.pid;

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    access_log /dev/stdout;
    error_log /dev/stderr;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/spa-security-headers.conf;

        # 构建产物文件名自带内容哈希，内容一变文件名就变，因此可以放心长缓存。
        # 不用 `expires 1y`：它会另发一个 Cache-Control，浏览器虽能合并，但响应头里出现
        # 两条同名指令只会让排查缓存问题时多绕一圈，这里一条写全。
        location /assets/ {
            # add_header 不会被继承进自己也写了 add_header 的 location，必须再 include 一次
            include /etc/nginx/spa-security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # index.html 是「当前该加载哪些 chunk」的清单，必须每次回源校验。
        # 不加这条时 nginx 不下发 Cache-Control，浏览器会按启发式规则自行缓存，
        # 于是发布后仍拿着旧清单去请求已经被删掉的 chunk —— 表现就是刷新后白屏。
        location = /index.html {
            # add_header 不会被继承进自己也写了 add_header 的 location，必须再 include 一次
            include /etc/nginx/spa-security-headers.conf;
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
