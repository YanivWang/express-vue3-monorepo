# 两个 SPA 静态站共用的安全响应头（由 Dockerfile.pc-portal / Dockerfile.pc-admin 拷进镜像）。
#
# 为什么单独一个文件而不是写进各自的 nginx.conf：
# nginx 的 add_header **不会**被继承进「自己也写了 add_header 的」子 location——
# 两个静态站都在 `location /assets/` 与 `location = /index.html` 里加了 Cache-Control，
# 只在 server 级写安全头的话，恰恰是这两个最常被请求的路径会把它们全部丢掉。
# 所以这里做成 include，凡是有 add_header 的地方都显式再 include 一次。
#
# 为什么这些头必须由静态站发：helmet 只作用在 API 上，而真正被浏览器当**文档**渲染的
# 恰恰是这两个站发出的 index.html。API 有一整套安全头、承载登录态的页面反而是裸的，
# 这个组合没有道理。

# 禁止 MIME 嗅探：即便某天有文件带着意外的扩展名落进静态目录，
# 浏览器也不会「猜」它其实是 HTML 而去执行它。
add_header X-Content-Type-Options "nosniff" always;

# 禁止被任何站点嵌进 frame（点击劫持）。CSP 的 frame-ancestors 是现代等价物，
# 两条都留是为了覆盖只认 X-Frame-Options 的旧浏览器。
add_header X-Frame-Options "DENY" always;

# 跨站跳转时只带 origin，不泄露完整路径（文章 id、后台路由都在路径里）。
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 明确关掉本站用不到的高权限能力，减少第三方脚本一旦混入时能做的事。
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# 内容安全策略。逐条都是按本仓实际需要放行的，不是抄来的模板：
#   default-src 'self'  —— 兜底：没有单独列出的资源类型一律只许同源。
#   script-src  'self'  —— 构建产物全部同源；Vue 用的是 runtime-only 构建、模板预编译，
#                          因此**不需要** unsafe-eval，这里刻意不给。
#                          ⚠️ 若将来有人 grep 产物发现 `new Function(` 而想补 'unsafe-eval'：
#                          先别急。那来自 Word 导入链上的 mammoth→bluebird（懒加载的
#                          wordImport-*.js 一个 chunk 里），bluebird 自带 CSP 回退，
#                          codegen 失败会自动降级到通用实现。这条已在真实镜像 + 真实浏览器下
#                          端到端验证过：无 unsafe-eval 时 .docx 仍能正常转成 HTML，
#                          且没有任何 CSP 违规上报。为一个用得到回退的懒加载 chunk
#                          给全站开 unsafe-eval，是拿最值钱的那条指令换一个并不存在的问题。
#   style-src   加 'unsafe-inline' —— Element Plus 与 Vue 的 scoped 样式会在运行时注入
#                          <style> 与内联 style 属性，这是框架行为，去不掉；
#                          仅样式的注入不构成脚本执行，是这套组合下可接受的取舍。
#   img-src     加 data: blob: —— 图标走 data: URI，上传前的本地预览走 blob:。
#   media-src   加 blob:  —— 视频同理。
#   font-src    加 data:  —— 部分图标字体以 data: 内联。
#   connect-src 'self'  —— API 经网关同源转发；跨域部署时须在此追加 API 源。
#   worker-src  'self' blob: —— 大文件上传的 MD5 计算跑在 Web Worker 里
#                          （views/large-file-upload/computeFileMd5.worker.ts）；
#                          Vite 视产物大小可能把它内联成 blob:，两种都要放行。
#   object-src  'none'  —— 本站没有任何 <object>/<embed>，直接关死。
#   base-uri / form-action 'self' —— 堵住「改 <base> 让相对 URL 指向别处」
#                          与「把表单 POST 到外站」这两条经典注入放大手段。
#   frame-ancestors 'none' —— 与上面的 X-Frame-Options 对应。
#
# 注意这里**没有** upgrade-insecure-requests：本仓自带的 Compose 网关默认只暴露明文 HTTP，
# 加上它会让浏览器把同源子资源全部升级到 https 而后失败，表现为整站白屏。
# 前面确实有 TLS 终端时再按部署追加。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
