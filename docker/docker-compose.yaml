# 生产覆盖层：必须配合 docker-compose.base.yaml。
# pnpm docker:prod
#
# HTTP 网关 `${GATEWAY_HOST_PORT:-2026}`：`docker/nginx/gateway.prod.docker.conf`；
# pc-portal 容器内 nginx 仅托管门户 SPA；pc-admin 挂载在 `/pc-admin/`。

name: express-vue3-monorepo-prod

services:
  mysql:
    container_name: express-vue3-monorepo-mysql
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "${MYSQL_CPUS:-2}"
          memory: ${MYSQL_MEMORY:-2g}
        reservations:
          memory: 512m

  redis:
    # 生产环境 Redis 服务
    container_name: express-vue3-monorepo-redis # 指定生产环境 Redis 容器名
    volumes:
      # 数据卷配置
      - redis_data:/data # 把 Redis 数据保存到 redis_data 卷，避免容器删除后数据丢失
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-1}"
          memory: ${REDIS_MEMORY:-512m}

  gateway:
    image: nginx:alpine
    container_name: express-vue3-monorepo-gateway
    volumes:
      - ./nginx/${NGINX_GATEWAY_CONF:-gateway.prod.docker.conf}:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_HOST_PORT:-2026}:2026"
    depends_on:
      rest-api:
        condition: service_healthy
      pc-portal:
        condition: service_started
      pc-admin:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${GATEWAY_CPUS:-1}"
          memory: ${GATEWAY_MEMORY:-256m}

  rest-api:
    container_name: express-vue3-monorepo-rest-api
    env_file:
      - ../.env.production
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "1"
    volumes:
      # 上传文件落在容器内 /app/uploads（src/utils/projectRoot.ts）。
      # 不挂卷则容器重建即丢文件；多副本部署时本地盘无法共享，须改用对象存储。
      - uploads_data:/app/uploads
      # 上传会话与秒传哈希索引（services/large-upload.service.ts 的 .data/）。
      # 必须与 uploads 成对持久化：只挂 uploads 会让成品文件还在、而秒传索引被清空，
      # 于是同一个文件重传时不再命中秒传，白白多存一份。
      - appdata:/app/.data
    deploy:
      resources:
        limits:
          cpus: "${REST_API_CPUS:-2}"
          memory: ${REST_API_MEMORY:-1g}
        reservations:
          memory: 256m

  pc-portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pc-portal
      # 私有 scope `@yanivjs/*` 只在自建 Verdaccio 上，且它当前绑在宿主 127.0.0.1。
      # host-gateway 让构建容器把 verdaccio.wxbjq.net.cn 解析回宿主——
      # 沿用原域名而不是改写成 host.docker.internal，是为了让 ~/.npmrc 里那条
      # `//verdaccio.wxbjq.net.cn/:_authToken=` 仍然匹配得上。
      extra_hosts:
        - "verdaccio.wxbjq.net.cn:host-gateway"
      # 凭据经 BuildKit secret 注入，不落进镜像层（见 Dockerfile.pc-portal 的说明）
      secrets:
        - npmrc
    container_name: express-vue3-monorepo-pc-portal
    restart: unless-stopped
    depends_on:
      rest-api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "${STATIC_CPUS:-0.5}"
          memory: ${STATIC_MEMORY:-128m}

  pc-admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pc-admin
      args:
        VITE_ADMIN_BASE: /pc-admin/
        VITE_API_BASE_URL: ""
    container_name: express-vue3-monorepo-pc-admin
    restart: unless-stopped
    depends_on:
      rest-api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "${STATIC_CPUS:-0.5}"
          memory: ${STATIC_MEMORY:-128m}

# 构建期凭据：开发者的用户级 npmrc，含私有 scope 的 registry 映射与 authToken。
# 仅作为 BuildKit secret 提供给 pc-portal 的构建阶段，不进镜像、不进运行时。
# ⚠️ 临时安排：私仓迁到公网可达地址后应当删除，改由仓库 .npmrc + CI secret 承担。
secrets:
  npmrc:
    file: ${HOME}/.npmrc

volumes:
  # MySQL 生产环境数据卷
  mysql_data:
  # Redis 生产环境数据卷
  redis_data:
  # 上传文件：与容器生命周期解耦（单机方案；多副本请换对象存储）
  uploads_data:
  # 上传会话 / 秒传索引：与 uploads_data 成对，二者不同步就会「文件在、索引丢」
  appdata:
