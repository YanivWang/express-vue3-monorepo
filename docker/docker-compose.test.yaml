# 测试/预发覆盖层：必须配合 docker-compose.base.yaml。生产镜像形态。
# pnpm docker:test
#
# HTTP 网关 `${GATEWAY_HOST_PORT:-2026}`：浏览器访问 SPA 与 `/api` 的统一入口（宿主机端口）。

name: express-vue3-monorepo-test

services:
  mysql:
    container_name: express-vue3-monorepo-mysql-test
    volumes:
      - mysql_test_data:/var/lib/mysql

  gateway:
    image: nginx:alpine
    container_name: express-vue3-monorepo-gateway-test
    volumes:
      - ./nginx/${NGINX_GATEWAY_CONF:-gateway.prod.docker.conf}:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_HOST_PORT:-2026}:2026"
    depends_on:
      rest-api:
        condition: service_started
      pc-portal:
        condition: service_started
      pc-admin:
        condition: service_started
    restart: unless-stopped

  rest-api:
    container_name: express-vue3-monorepo-rest-api-test
    env_file:
      - ../.env.test
    environment:
      APP_ENV: test
      NODE_ENV: test
      PORT: "3000"
      TRUST_PROXY: "1"

  pc-portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pc-portal
      # 私有 scope @yanivjs/*，同 docker-compose.yaml 的安排（临时，私仓转公网后删除）
      extra_hosts:
        - "verdaccio.wxbjq.net.cn:host-gateway"
      secrets:
        - npmrc
    container_name: express-vue3-monorepo-pc-portal-test
    restart: unless-stopped
    depends_on:
      rest-api:
        condition: service_started

  pc-admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pc-admin
      args:
        VITE_ADMIN_BASE: /pc-admin/
        VITE_API_BASE_URL: ""
    container_name: express-vue3-monorepo-pc-admin-test
    restart: unless-stopped
    depends_on:
      rest-api:
        condition: service_started

volumes:
  mysql_test_data:

# 构建期凭据：私有 scope @yanivjs/* 的 authToken，不进镜像层。
# 临时安排，私仓转公网后应改由仓库 .npmrc + CI secret 承担。
secrets:
  npmrc:
    file: ${HOME}/.npmrc
